name: Knowledge Tree CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python scripts/validate_tree.py
      - run: python scripts/build_indexes.py --check
      - run: python scripts/check_links.py
      - run: python scripts/audit_navigation_gaps.py
      - run: pytest -q

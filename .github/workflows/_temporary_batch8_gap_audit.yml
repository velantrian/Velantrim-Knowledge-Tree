name: Temporary Batch 8 navigation gap audit

on:
  push:
    branches:
      - knowledge-tree/gaps-audit-batch-8
    paths:
      - registry/.run_batch8_gap_audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: knowledge-tree/gaps-audit-batch-8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python scripts/validate_tree.py
      - run: python scripts/build_indexes.py --check
      - run: python scripts/audit_navigation_gaps.py

name: Temporary refresh Knowledge Tree indexes batch 8

on:
  push:
    branches:
      - knowledge-tree/gaps-audit-batch-8
    paths:
      - registry/.refresh_indexes_batch8

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: knowledge-tree/gaps-audit-batch-8
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python scripts/validate_tree.py
      - run: python scripts/build_indexes.py
      - run: python scripts/build_indexes.py --check
      - run: python scripts/check_links.py
      - run: python scripts/audit_navigation_gaps.py
      - run: pytest -q
      - name: Commit generated indexes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- indexes; then
            echo "Indexes already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indexes
          git commit -m "chore: refresh deterministic Knowledge Tree indexes for batch 8"
          git push origin HEAD:knowledge-tree/gaps-audit-batch-8
